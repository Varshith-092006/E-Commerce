user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Phase 9: Server Banner & Version Hiding
  server_tokens off;

  # Phase 9: Structured JSON Access Logging (Omitting Credentials & Sensitive Headers)
  log_format json_analytics escape=json '{'
    '"time_local":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request_method":"$request_method",'
    '"request_uri":"$uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"http_referrer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"request_id":"$http_x_request_id"'
  '}';

  access_log /var/log/nginx/access.log json_analytics;

  # Network & Socket Settings
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  types_hash_max_size 2048;

  # Phase 9: Timeout Hardening (Slowloris & Slow-Client Protection)
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 15s;
  keepalive_timeout 65;

  # Phase 9: Request Size & Header Boundaries
  client_max_body_size 10M;
  client_body_buffer_size 128k;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;

  # Phase 9: Edge Rate Limiting & Connection Quotas (429 = Quota Exceeded)
  limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
  limit_conn_status 429;

  limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=50r/s;
  limit_req_status 429;

  # Phase 3: Response Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/json text/plain text/css application/javascript application/xml;

  include /etc/nginx/conf.d/*.conf;
}
