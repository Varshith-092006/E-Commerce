# HTTP server — 301 Redirect to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name localhost _;

  # Health check for Nginx itself on port 80
  location /nginx-health {
    access_log off;
    return 200 "healthy\n";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS server — TLS termination & reverse proxy
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name localhost _;

  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Phase 9: Security Headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Proxy common settings
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection 'upgrade';
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $http_x_request_id;
  proxy_cache_bypass $http_upgrade;

  # Phase 9: Strip externally supplied internal identity and secret headers
  proxy_set_header X-Internal-Gateway-Secret "";
  proxy_set_header X-User-Id "";
  proxy_set_header X-User-Role "";
  proxy_set_header X-User-Email "";
  proxy_set_header X-Seller-Id "";

  # Hide duplicate upstream security headers so Nginx is single authoritative source
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-XSS-Protection;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Strict-Transport-Security;

  # API Gateway — SSE Streaming Endpoint (unbuffered, chunked disabled, extended keepalive)
  location /api/v1/notifications/stream {
    proxy_pass http://gateway:4000;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;
  }

  # API Gateway (with edge connection & rate limiting)
  location /api/ {
    # Phase 9: Rate limiting & connection boundaries
    limit_conn conn_limit_per_ip 50;
    limit_req zone=req_limit_per_ip burst=100 nodelay;

    proxy_pass http://gateway:4000;
    proxy_connect_timeout 15s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503;
  }

  # Seller Web
  location /seller/ {
    proxy_pass http://seller-web:3001/;
  }

  # Admin Web
  location /admin/ {
    proxy_pass http://admin-web:3002/;
  }

  # Customer Web (Root / Storefront)
  location / {
    proxy_pass http://customer-web:3000/;
  }
}
