global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'ecommerce-platform'

rule_files:
  - /etc/prometheus/alert_rules.yml

# ─── Scrape Configurations ────────────────────────────────────────────────────
# All services expose /metrics via prom-client (metricsEndpoint middleware)

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Gateway
  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:4000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Identity Service
  - job_name: 'identity-svc'
    static_configs:
      - targets: ['identity-svc:4001']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Catalog Service
  - job_name: 'catalog-svc'
    static_configs:
      - targets: ['catalog-svc:4002']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Order Service
  - job_name: 'order-svc'
    static_configs:
      - targets: ['order-svc:4003']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Payment Service
  - job_name: 'payment-svc'
    static_configs:
      - targets: ['payment-svc:4004']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Fulfillment Service
  - job_name: 'fulfillment-svc'
    static_configs:
      - targets: ['fulfillment-svc:4005']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Notification Service
  - job_name: 'notification-svc'
    static_configs:
      - targets: ['notification-svc:4006']
    metrics_path: '/metrics'
    scrape_interval: 15s
